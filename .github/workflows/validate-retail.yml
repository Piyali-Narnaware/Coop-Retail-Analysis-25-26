name: Validate retail data pipeline
on:
  push:
    paths:
      - 'data_cleaning.py'
      - 'data_exploration.py'
      - '.github/workflows/validate-retail.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python data_cleaning.py
      - run: python data_exploration.py
